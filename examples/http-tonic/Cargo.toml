[package]
name = "http-tonic"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = { path = "../../lambda-http" }
prost = "0.14"
tokio = { version = "1", features = ["macros"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router"] }
tonic-prost = "0.14"
tonic-web = "0.14"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
